<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>社保政务问答 Demo</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2329;
    --muted: #86909c;
    --accent: #1652f0;
    --user-bubble: #1652f0;
    --user-text: #ffffff;
    --ai-bubble: #f2f3f5;
    --border: #e5e6eb;
    --error: #e5484d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    background: var(--card);
  }
  header { padding: 20px; border-bottom: 1px solid var(--border); }
  header h1 { font-size: 18px; }
  header p { font-size: 12px; color: var(--muted); margin-top: 4px; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .user {
    align-self: flex-end;
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }
  .ai {
    align-self: flex-start;
    background: var(--ai-bubble);
    border-bottom-left-radius: 4px;
  }
  @keyframes blink { 50% { opacity: .35; } }
  .thinking { animation: blink 1s infinite; }
  .error { color: var(--error); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 20px 12px; }
  .chip {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--accent);
    background: var(--card);
    cursor: pointer;
  }
  .chip:hover { background: #f0f4ff; }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px 20px;
    border-top: 1px solid var(--border);
  }
  input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>社保政务问答</h1>
    <p>LangGraph Agent × MCP 工具层 × FastAPI × SSE 流式 · Demo</p>
  </header>
  <div id="chat"></div>
  <div class="chips">
    <button class="chip" type="button">单位参保登记需要什么材料？</button>
    <button class="chip" type="button">社保增减员怎么办理？</button>
  </div>
  <form id="form">
    <input id="q" placeholder="请输入社保相关问题" autocomplete="off">
    <button id="send" type="submit">发送</button>
  </form>
</div>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("q");
const send = document.getElementById("send");

// 极简 markdown 渲染：先整体转义（防 XSS），再只注入我们自己生成的标签
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
}
function mdRender(s) {
  const lines = escapeHtml(s).split("\n");
  return lines.map(line => {
    let l = line.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    l = l.replace(/^#{1,6}\s*(.*)$/, "<strong>$1</strong>");
    l = l.replace(/^[-*]\s+(.*)$/, "· $1");
    return l;
  }).join("\n");
}

function addBubble(cls, text) {
  const div = document.createElement("div");
  div.className = "bubble " + cls;
  div.textContent = text;   // textContent 而非 innerHTML：不解析任何标签，防 XSS
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

addBubble("ai", "你好，我是社保政务问答助手，可以咨询单位参保、社保增减员等 77 项社保业务。知识范围之外的问题我会如实告知无法回答。");

async function ask(question) {
  addBubble("user", question);
  const thinking = addBubble("ai thinking", "正在检索知识库并思考，约需十几秒…");
  send.disabled = true;
  input.disabled = true;
  let answer = "";       // 累积的答案文本
  let started = false;   // 是否已收到首个 token
  try {
    const resp = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question })
    });
    if (!resp.ok) throw new Error("HTTP " + resp.status);

    // 流式三件套：reader 取流把手 → TextDecoder 解字节 → buffer 拼被切半的事件
    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      // stream:true 让跨块被切成两半的多字节中文字符正确拼接
      buffer += decoder.decode(value, { stream: true });
      // SSE 行规：事件以 \n\n 分隔；一次网络块可能含多个事件或半个事件
      let idx;
      while ((idx = buffer.indexOf("\n\n")) !== -1) {
        const raw = buffer.slice(0, idx).trim();
        buffer = buffer.slice(idx + 2);
        if (!raw.startsWith("data:")) continue;
        const token = JSON.parse(raw.slice(5).trim()).token ?? "";
        if (!token) continue;
        answer += token;
        if (!started) {                       // 首 token 到达：loading 气泡转正为答案气泡
          thinking.classList.remove("thinking");
          started = true;
        }
        thinking.innerHTML = mdRender(answer);
        chat.scrollTop = chat.scrollHeight;
      }
    }
    if (!started) {                           // 河流完了却一个 token 都没来
      thinking.classList.remove("thinking");
      thinking.textContent = answer || "（空响应）";
    }
  } catch (e) {
    thinking.classList.remove("thinking");
    if (started) {                            // 流中断：保留已收到的部分 + 标注中断
      thinking.innerHTML = mdRender(answer + "\n\n（连接中断：" + e.message + "）");
    } else {
      thinking.classList.add("error");
      thinking.textContent = "请求失败：" + e.message + "（请确认已启动 uvicorn api:app，且已配置 .env）";
    }
  } finally {
    send.disabled = false;
    input.disabled = false;
    input.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q || send.disabled) return;
  input.value = "";
  ask(q);
});

document.querySelectorAll(".chip").forEach(chip =>
  chip.addEventListener("click", () => {
    if (!send.disabled) ask(chip.textContent);
  })
);
</script>
</body>
</html>
